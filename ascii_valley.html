<script>
"use strict";
// ═══ Πλήκτρα ═══  Space pause · T ώρα · E εποχή · S screenshot
// Πλάτος κελιού σε pixel (ύψος = 2×):  ascii_valley.html?cell=2 (πιο ευκρινές) ή ?cell=4 (πιο ελαφρύ)
const Q=typeof location!=="undefined"?new URLSearchParams(location.search):new URLSearchParams("");
const clamp=(v,a,b)=>v<a?a:v>b?b:v,sm=(a,b,x)=>{x=clamp((x-a)/(b-a),0,1);return x*x*(3-2*x)};
const mix=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];
const FIXED=+Q.get("cell")||0;let CWC=clamp(FIXED||3,2,10);
const SIGNATURE="@ascii.valley",BW=700,BH=784,FPS=30,DAY=240,P0=.06,SPEED=3.2,CRUISE=12;
const P=192,HALF=96,RES=3,NX=HALF*2*RES,NZ=P*RES,WL=1,TAU=Math.PI*2,F=BH*.95,MAXZ=160;
let seed=5;const rnd=()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const gs=s=>(s+s[s.length-1].repeat(16)).slice(0,16);
// σετ χαρακτήρων σκούρο → φωτεινό: γρασίδι, βράχος, χιόνι, άμμος, νερό, φύλλα, ξύλο, σύννεφο, βελόνες
const SETS=[".,'\":;^+vwxXW&%#",".:-=+*xX%#&@MWW@",". .:'*+oO0@@@@@@@",".,:;-~=+*x%#&@@@",".-~-~=~=~=~*~*+",".:;-=+*^vxoXW&%#@","|!il1IH#@@@@@@@@@","  ..::;;-=+*oO0@@",".,'`^^~vVYAWM#@"];
const CC=SETS.map(s=>Array.from(s,c=>c.charCodeAt(0)));
const [G_GRASS,G_ROCK,G_SNOW,G_SAND,G_WATER,G_LEAF,G_WOOD,G_CLOUD,G_NEEDLE]=[0,1,2,3,4,5,6,7,8];

// ═══ θόρυβος και ύψος εδάφους (περιοδικό στον άξονα z → η πτήση δεν τελειώνει ποτέ) ═══
function hash(ix,iz){let h=(ix*374761393+iz*668265263)|0;h=(h^(h>>>13))*1274126177|0;return((h^(h>>>16))>>>0)/4294967296}
function vnoise(x,z,pz){const ix=Math.floor(x),iz=Math.floor(z),fx=x-ix,fz=z-iz,ux=fx*fx*(3-2*fx),uz=fz*fz*(3-2*fz),
  z0=((iz%pz)+pz)%pz,z1=(((iz+1)%pz)+pz)%pz,a=hash(ix,z0),b=hash(ix+1,z0),c=hash(ix,z1),d=hash(ix+1,z1);
  return a+(b-a)*ux+(c-a)*uz+(a-b-c+d)*ux*uz}
function fbm(x,z){let s=0,a=.5,f=1/24;for(let o=0;o<5;o++){s+=a*vnoise(x*f,z*f,Math.round(P*f));a*=.5;f*=2}return s}
const mer=z=>14*Math.sin(TAU*z/P)+6*Math.sin(TAU*3*z/P+1.3);          // το ποτάμι μαιανδρίζει
function terrainH(x,z){
  const u=x-mer(z),au=Math.abs(u),val=1-Math.exp(-u*u/648),n=fbm(x,z)-.48,dz=((z-100+P/2)%P+P)%P-P/2;
  let h=1.2+14*Math.pow(val,1.3)+n*(3+26*val);                          // κοιλάδα + λόφοι
  // Λεπτή ανομοιομορφία στο έδαφος, εντονότερη μακριά από την κοίτη.
  h+=(vnoise(x*.22+17,z*.22+9,Math.max(8,Math.round(P*.22)))-.5)*.72*sm(2,12,au);
  // Ακανόνιστες μικρές προεξοχές στις όχθες, χωρίς να χαλάει η βασική πορεία του ποταμού.
  const bank=sm(1.2,3.5,au)*(1-sm(7,10,au)),bn=vnoise(x*.31+43,z*.31+21,Math.max(8,Math.round(P*.31)));
  h+=(bn-.5)*1.15*bank;
  const m=Math.max(0,(au-40)/40);h+=26*m*m*(1+.6*(fbm(x+57,z)-.4));      // βουνά στο βάθος
  return h-3.4*Math.exp(-u*u/18)-5.6*Math.exp(-((u-2)*(u-2)/60+dz*dz/340))}   // κοίτη ποταμού + λίμνη γύρω στο z=100

const NN=NX*NZ,Hm=new Float32Array(NN),Nx=new Float32Array(NN),Ny=new Float32Array(NN),Nz=new Float32Array(NN),Cm=new Uint8Array(NN*3),Km=new Uint8Array(NN),Am=new Uint8Array(NN);
let Sh=new Uint8Array(NN),TS=new Uint8Array(NN),TB=new Uint8Array(NN);   // σκιές εδάφους (λόφοι), σκιές δέντρων (ζωντανό + υπό κατασκευή)
for(let j=0;j<NZ;j++)for(let i=0;i<NX;i++)Hm[j*NX+i]=terrainH(-HALF+i/RES,j/RES);
const OFF=3*RES;
for(let j=0;j<NZ;j++)for(let i=0;i<NX;i++){
  const b=j*NX+i,x=-HALF+i/RES,z=j/RES,h=Hm[b],xl=Math.max(i-1,0),xr=Math.min(i+1,NX-1),jd=(j+NZ-1)%NZ,ju=(j+1)%NZ;
  const dx=(Hm[j*NX+xr]-Hm[j*NX+xl])*RES/2,dz=(Hm[ju*NX+i]-Hm[jd*NX+i])*RES/2,l=Math.hypot(dx,1,dz);
  Nx[b]=-dx/l;Ny[b]=1/l;Nz[b]=-dz/l;
  const avg=(Hm[j*NX+Math.max(i-OFF,0)]+Hm[j*NX+Math.min(i+OFF,NX-1)]+Hm[((j+OFF)%NZ)*NX+i]+Hm[((j+NZ-OFF)%NZ)*NX+i])/4;
  Am[b]=clamp(1-(avg-h)*.09,.55,1.2)*100;
  const s=1-Ny[b],m=vnoise(x/12+9,z/12,16),n2=hash(i,j),pn=vnoise(x/3+5,z/3,64),pu=x-mer(z)-(8+2*Math.sin(z/9));let k=0,r,g,bl;
  if(h>30+(m-.5)*6){k=2;r=g=bl=232+n2*20}
  else if(s>.36||h>25){k=1;const v=.82+.18*Math.sin(h*2.4+pn*4)+n2*.12;r=118*v;g=112*v;bl=106*v}
  else if(h<WL+.55){k=3;const w=n2>.8?.78:1;r=196*w;g=178*w;bl=122*w}
  else if(Math.abs(pu)<.8&&s<.22){k=3;const w=.85+.3*n2;r=158*w;g=130*w;bl=94*w}                  // μονοπάτι δίπλα στο ποτάμι
  else{const v=.78+.42*pn;r=(48+100*m)*v;g=(128+22*m)*v;bl=(44+10*m)*v}
  Cm[b*3]=r;Cm[b*3+1]=g;Cm[b*3+2]=bl;Km[b]=k}
function hAt(x,z){let xi=clamp((x+HALF)*RES,0,NX-1.01),zi=z*RES;zi-=Math.floor(zi/NZ)*NZ;
  const i=xi|0,j=zi|0,a=xi-i,c=zi-j,j1=(j+1)%NZ;return Math.max(WL,Hm[j*NX+i]*(1-a)*(1-c)+Hm[j*NX+i+1]*a*(1-c)+Hm[j1*NX+i]*(1-a)*c+Hm[j1*NX+i+1]*a*c)}
const CT=new Float32Array(4096);{const L=Array.from({length:64},rnd);for(let j=0;j<64;j++)for(let i=0;i<64;i++){const u=i/8,v=j/8,iu=Math.floor(u),iv=Math.floor(v),fu=u-iu,fv=v-iv,a=sm(0,1,fu),b=sm(0,1,fv),
  g=(p,q)=>L[((q&7)<<3)|(p&7)];CT[j*64+i]=g(iu,iv)*(1-a)*(1-b)+g(iu+1,iv)*a*(1-b)+g(iu,iv+1)*(1-a)*b+g(iu+1,iv+1)*a*b}}
function cloudS(x,z,t){const u=x*.04+t*.06,v=z*.04,iu=Math.floor(u),iv=Math.floor(v),fu=u-iu,fv=v-iv,i0=iu&63,j0=iv&63,i1=(i0+1)&63,j1=(j0+1)&63,
  a=CT[j0*64+i0],b=CT[j0*64+i1],c=CT[j1*64+i0],d=CT[j1*64+i1];return sm(.5,.74,a+(b-a)*fu+(c-a)*fv+(a-b-c+d)*fu*fv)}

// ═══ πρότυπα από σημεία: [x,y,z, nx,ny,nz, είδος, απόκρυψη φωτός] ═══
// είδη: 0 φύλλα · 1 ξύλο · 2-4 τόνοι φύλλων · 6 καλάμι
const ST=8,Pt=(d,x,y,z,nx,ny,nz,k,ao)=>d.push(x,y,z,nx,ny,nz,k,ao),TN=[0,2,3,4];
const rv=()=>{const w=[rnd()-.5,rnd()-.5,rnd()-.5],l=Math.hypot(...w)||1;return[w[0]/l,w[1]/l,w[2]/l]};
function trunkPts(d,h,r0,n){for(let q=0;q<n;q++){const y=q*h/n,r=r0*(1+.9*Math.max(0,1-q/3));for(let m=0;m<2;m++){const a=rnd()*TAU;Pt(d,Math.cos(a)*r,y,Math.sin(a)*r,Math.cos(a),0,Math.sin(a),1,1)}}}
function conifer(v){const d=[],R0=[1.5,1.9,2.0][v],Ht=[6.4,6.0,5.2][v],tiers=[8,6,7][v],y00=[.9,1.9,.5][v];
  for(let L=0;L<tiers;L++){const u=L/tiers,y0=y00+(Ht-y00-.6)*u,R=R0*(1-u*.9)*(v===1?.75+.5*rnd():1),nb=Math.max(4,Math.round((v===2?9:7)*(1-u*.6)));
    for(let b=0;b<nb;b++){const a=TAU*(b+rnd()*.7)/nb+L*.8,tone=TN[(rnd()*4)|0];
      for(let q=1;q<=4;q++){const r=R*(q/4)*(.85+rnd()*.3),aa=a+(rnd()-.5)*.28,ca=Math.cos(aa),sa=Math.sin(aa),y=y0-r*.22-q*.04,j=(rnd()-.5)*.1;
        Pt(d,ca*r,y+.06+j,sa*r,ca*.55,.85,sa*.55,tone,.8+.2*q/4);
        Pt(d,ca*r*.97,y-.12+j,sa*r*.97,ca*.5,-.7,sa*.5,tone,.5)}}}
  trunkPts(d,Ht-.4,.08,12);Pt(d,0,Ht,0,0,1,0,0,1);return d}
function broadleaf(v){
  const d=[],trH=[2.2,2.6,2.4][v],height=[3.3,3.8,3.2][v];
  trunkPts(d,trH,v===2?.065:.09,18);

  // Ασύμμετρος σκελετός με κλαδιά διαφορετικού μήκους και κλίσης.
  const branches=v===0?5:v===1?6:4;
  for(let b=0;b<branches;b++){
    const a=TAU*b/branches+(rnd()-.5)*.65;
    const len=.75+rnd()*.85,rise=.65+rnd()*.55;
    for(let q=1;q<=9;q++){
      const u=q/9,x=Math.cos(a)*len*u,z=Math.sin(a)*len*u,y=trH-.12+rise*u;
      Pt(d,x,y,z,Math.cos(a)*.7,.35,Math.sin(a)*.7,1,.85);
      if(q===5||q===8){
        const aa=a+(rnd()-.5)*1.1,ll=.35+rnd()*.35;
        for(let j=1;j<=4;j++){const f=j/4;
          Pt(d,x+Math.cos(aa)*ll*f,y+.12*f,z+Math.sin(aa)*ll*f,Math.cos(aa),.25,Math.sin(aa),1,.8)}
      }
    }
  }

  // Ανομοιόμορφοι λοβοί αντί για μία σφαιρική μάζα φυλλώματος.
  const lobes=v===0?6:v===1?7:5,centers=[];
  for(let c=0;c<lobes;c++){
    const a=TAU*c/lobes+(rnd()-.5)*.8,ring=.25+rnd()*.62;
    centers.push([Math.cos(a)*ring,trH+.45+rnd()*height*.52,Math.sin(a)*ring,
      (v===1?.72:.62)+rnd()*.38,.72+rnd()*.52,(v===2?.62:.72)+rnd()*.38]);
  }
  for(let c=0;c<centers.length;c++){
    const [cx,cy,cz,rx,ry,rz]=centers[c],tone=TN[(rnd()*4)|0],count=34+(rnd()*17|0);
    for(let q=0;q<count;q++){
      const [nx,ny,nz]=rv(),rad=Math.pow(rnd(),.58);
      const wobble=1+.13*Math.sin(Math.atan2(nz,nx)*3+c*1.7)+.08*(rnd()-.5);
      const x=cx+nx*rx*rad*wobble,y=cy+ny*ry*rad*wobble,z=cz+nz*rz*rad*wobble;
      const normal=[nx/Math.max(.1,rx),ny/Math.max(.1,ry),nz/Math.max(.1,rz)],nl=Math.hypot(...normal);
      Pt(d,x,y,z,normal[0]/nl,normal[1]/nl,normal[2]/nl,tone,.48+.52*(ny+1)/2);
    }
  }

}
function shrub(){
  // Χαμηλός, πλατύς θάμνος με ακανόνιστη περίμετρο και μικρούς λοβούς.
  const d=[],lobes=5+(rnd()*3|0);
  for(let b=0;b<5;b++){
    const a=TAU*b/5+(rnd()-.5)*.6,len=.28+rnd()*.34;
    for(let q=1;q<=5;q++){const u=q/5;
      Pt(d,Math.cos(a)*len*u,.12+.34*u,Math.sin(a)*len*u,Math.cos(a)*.7,.45,Math.sin(a)*.7,1,.8)}
  }
  for(let c=0;c<lobes;c++){
    const a=TAU*c/lobes+(rnd()-.5)*.9,ring=.12+rnd()*.42;
    const cx=Math.cos(a)*ring,cz=Math.sin(a)*ring,cy=.38+rnd()*.28;
    const rx=.34+rnd()*.22,ry=.32+rnd()*.2,rz=.34+rnd()*.22;
    const count=20+(rnd()*13|0),tone=TN[(rnd()*4)|0];
    for(let q=0;q<count;q++){
      const [nx,ny,nz]=rv(),rad=Math.pow(rnd(),.62);
      const wobble=1+.16*Math.sin(Math.atan2(nz,nx)*3+c)+.08*(rnd()-.5);
      const x=cx+nx*rx*rad*wobble,y=Math.max(.035,cy+ny*ry*rad*wobble),z=cz+nz*rz*rad*wobble;
      const normal=[nx/rx,ny/ry,nz/rz],nl=Math.hypot(...normal);
      Pt(d,x,y,z,normal[0]/nl,normal[1]/nl,normal[2]/nl,q%7===0?2:tone,.48+.52*(ny+1)/2);
    }
  }
  return d
}
function reeds(){   // λεπτές κατακόρυφες λεπίδες με σκουρόχρωμη κορυφή
  const d=[];for(let b=0;b<8;b++){const x=(rnd()-.5)*.9,z=(rnd()-.5)*.9,l=1+rnd()*.9,ln=(rnd()-.5)*.3;
    for(let q=0;q<5;q++)Pt(d,x+ln*q/5*l,q*l/5,z,0,1,.2,6,.65+.35*q/5);Pt(d,x+ln*l,l+.08,z,0,1,0,1,.9)}return d}
// 0-2 κωνοφόρα · 3-5 φυλλοβόλα · 6 θάμνος · 7 καλάμια
const TPL=[0,1,2].map(v=>conifer(v)).concat([0,1,2].map(v=>broadleaf(v)),[shrub(),reeds()]).map(d=>({d:new Float32Array(d),n:d.length/ST}));
const IMP=[[1.5,6.4,.5],[1.9,6.0,1.8],[2.0,5.2,.4],[2.0,5.0,2.0],[.9,6.2,2.2],[1.2,5.2,2.2]],TIERS=[8,6,7],PLOD=[38,30],
  FOLC=[[30,86,52],[40,100,58],[26,78,60]],FOL=[[0,0,0],[56,134,52],[110,156,52],[212,126,40],[196,66,44]],AUT=[[212,126,40],[196,66,44],[235,190,60],[150,160,50]],BLO=[[240,170,200],[246,240,236]],
  TRK=[[80,58,40],[88,64,44],[74,54,40],[92,66,44],[100,80,60],[176,170,160]],TONE=[[1,1,1],[1,1,1],[1.15,1.05,.8],[.8,.9,.92],[1.15,1.15,1.1]],
  KCOL=[0,[104,76,50],0,0,0,0,[142,160,72]],BN=Float32Array.from({length:4096},rnd);
const FOLS=FOL.map(c=>c.slice()),FOLCS=FOLC.map(c=>c.slice());

// ═══ στιγμιότυπα: δέντρα, θάμνοι, καλάμια ═══
const tx=[],tz=[],ty=[],ts=[],tw=[],tca=[],tsa=[],tv=[],tc=[],tb=[],TREEIDX=[];
function inst(x,z,y,sc,wd,ang,v,c){tx.push(x);tz.push(z);ty.push(y);ts.push(sc);tw.push(wd);tca.push(Math.cos(ang));tsa.push(Math.sin(ang));tv.push(v);tc.push(c);tb.push(rnd());return tx.length-1}
for(let a=0;a<30000&&TREEIDX.length<3400;a++){
  const x=-HALF+8+rnd()*(2*HALF-16),z=rnd()*P,ci=((x+HALF)*RES)|0,cj=(z*RES)|0,b=cj*NX+ci,h=Hm[b];
  if(h<WL+.7||h>24||1-Ny[b]>.25||Km[b]===3)continue;
  if(rnd()>(vnoise(x/12+3,z/12,16)-.36)*2.4)continue;
  const type=h>14||rnd()<.45?0:1,r=rnd(),sc=.75+rnd()*.8,v=type?3+((rnd()*3)|0):((rnd()*3)|0);
  TREEIDX.push(inst(x,z,h,sc,.85+rnd()*.35,rnd()*TAU,v,type?(v===5?(r<.7?2:1):(r<.5?1:r<.75?2:r<.9?3:4)):0));
  const rad=Math.ceil(1.6*sc*RES);
  for(let dj=-rad;dj<=rad;dj++)for(let di=-rad;di<=rad;di++){const d2=(di*di+dj*dj)/(rad*rad);if(d2>1)continue;const ii=ci+di,jj=((cj+dj)%NZ+NZ)%NZ;if(ii<0||ii>=NX)continue;
    const q=(1-.5*(1-d2)*(1-d2)),o=(jj*NX+ii)*3;Cm[o]*=q;Cm[o+1]*=q;Cm[o+2]*=q}}
const NTREE=TREEIDX.length;
function scatter(n,tries,v,ok,scl,tcs){for(let a=0,c=0;a<tries&&c<n;a++){const x=-HALF+8+rnd()*(2*HALF-16),z=rnd()*P,b=(((z*RES)|0)*NX)+(((x+HALF)*RES)|0),h=Hm[b];
  if(!ok(x,z,h,b))continue;inst(x,z,h,scl[0]+rnd()*scl[1],.85+rnd()*.35,rnd()*TAU,v,tcs[(rnd()*tcs.length)|0]);c++}}
scatter(1500,20000,6,(x,z,h,b)=>h>WL+.6&&1-Ny[b]<.4&&Km[b]===0&&vnoise(x/8,z/8,24)>.42,[.9,.7],[1,1,2]);     // πράσινοι θάμνοι
scatter(900,60000,7,(x,z,h,b)=>h>WL-.2&&h<WL+.4,[.8,.6],[1]);                                                  // καλάμια στα ρηχά
const NT=tx.length;

// ═══ κατάσταση: εποχή ═══
const ctl={ss:1.15,ssT:1.15};let SP={tint:[1,1,1],aut:.2,leaf:1,snow:0,blo:0,grass:[1,1,1]};
const SEAS=[{tint:[1.12,1.18,.82],aut:0,leaf:1,snow:0,blo:.4,grass:[1,1.14,.9]},{tint:[1,1,1],aut:.15,leaf:1,snow:0,blo:0,grass:[1,1,1]},
  {tint:[1.15,.92,.7],aut:1,leaf:.92,snow:0,blo:0,grass:[1.22,.9,.62]},{tint:[.9,.95,1],aut:0,leaf:.04,snow:1,blo:0,grass:[.95,.97,1]}],SEASN=["άνοιξη","καλοκαίρι","φθινόπωρο","χειμώνας"];
function seasonUpdate(){const s=((ctl.ss%4)+4)%4,i=Math.floor(s),f=sm(0,1,s-i),A=SEAS[i],B2=SEAS[(i+1)%4],L=(a,b)=>a+(b-a)*f,V=(a,b)=>a.map((x,k)=>x+(b[k]-x)*f);
  SP={tint:V(A.tint,B2.tint),aut:L(A.aut,B2.aut),leaf:L(A.leaf,B2.leaf),snow:L(A.snow,B2.snow),blo:L(A.blo,B2.blo),grass:V(A.grass,B2.grass)};
  const om=clamp(.55+SP.aut*.9-SP.blo*1.5,0,1);
  for(let k=1;k<5;k++)for(let q=0;q<3;q++){const bs=k>=3?[96,150,52][q]*(1-om)+FOL[k][q]*om:FOL[k][q];FOLS[k][q]=bs*SP.tint[q]*(1-SP.aut)+AUT[k%4][q]*SP.aut}
  for(let v=0;v<3;v++)for(let q=0;q<3;q++)FOLCS[v][q]=FOLC[v][q]*(.6+.4*SP.tint[q])}
function updateState(t,dt){ctl.ss+=(ctl.ssT-ctl.ss)*(1-Math.exp(-dt*1.2));seasonUpdate()}

// ═══ ουρανός, ήλιος, φως ═══
const NIGHT_T=[6,8,22],NIGHT_H=[14,18,40],DAY_T=[44,104,196],DAY_H=[176,208,236],WARM_H=[255,150,96];
function env(t){

  const [S0,S1,S2]=E.S,sunI=E.sunI,[a0,a1,a2]=E.amb,[u0,u1,u2]=E.sunC,[f0,f1,f2]=E.hor,snowT=SP.snow,blo=SP.blo;
  for(let cell=0;cell<NC;cell++){const w=win[cell];if(w<0)continue;
    const i=w>>10,kk=w&1023,v=tv[i],f=FOGT[(zb[cell]*2)|0],nz=NOI[(cell*7)&1023];let R,G,B,vv;
    if(kk===1022){const c=TRK[v],dif=sunI*.5;R=c[0]*(a0+u0*dif);G=c[1]*(a1+u1*dif);B=c[2]*(a2+u2*dif);R+=(f0-R)*f;G+=(f1-G)*f;B+=(f2-B)*f;code[cell]=124;cr[cell]=R;cg[cell]=G;cb[cell]=B;continue}
    if(kk===1023){const yf=aux[cell]/255,con=v<3,c=con?FOLCS[v]:FOLS[tc[i]],rr=(cell/COLS)|0,cc=cell-rr*COLS,dif=sunI*(.5+.3*(1-yf)),
        bl=con?.78+.4*Math.max(0,Math.sin(yf*TAU*TIERS[v]+i)):.7+.55*BN[((((rr*.6)|0)+i*5)&63)*64+((((cc*.4)|0)+i*3)&63)],sh=bl*(.7+.5*(1-yf))*(.85+.3*nz);
      R=c[0]*sh*(a0+u0*dif);G=c[1]*sh*(a1+u1*dif);B=c[2]*sh*(a2+u2*dif);
      if(snowT>0&&con){const q=snowT*(.35+.3*(1-yf));R+=(235-R)*q;G+=(238-G)*q;B+=(245-B)*q}
      vv=Math.max(R,G,B)/255*1.25*(1-f*.8);R+=(f0-R)*f;G+=(f1-G)*f;B+=(f2-B)*f;
      code[cell]=CC[G_LEAF][clamp(vv*15+(nz-.5)*2,0,15)|0];cr[cell]=R;cg[cell]=G;cb[cell]=B;continue}
    const d=TPL[v].d,o=kk*ST,kind=d[o+6],ca=tca[i],sa=tsa[i],fol=kind===0||(kind>=2&&kind<=4),ao=d[o+7],
      nd=(d[o+3]*ca-d[o+5]*sa)*S0+d[o+4]*S1+(d[o+3]*sa+d[o+5]*ca)*S2;let c=fol?(v<3?FOLCS[v]:FOLS[tc[i]]):kind===6?KCOL[6]:v<6?TRK[v]:KCOL[1];
    if(fol&&v>=3&&v<6&&blo>0&&tb[i]<blo)c=BLO[(tb[i]*997|0)&1];
    const tn=TONE[kind]||TONE[0],dif=sunI*(Math.max(0,nd)+(fol?.28*Math.max(0,-nd):0)),sh=(.55+.55*ao)*(fol?.85+.25*d[o+1]*ts[i]/6:1)*(.8+.4*nz);
    R=c[0]*tn[0]*sh*(a0*ao+u0*dif);G=c[1]*tn[1]*sh*(a1*ao+u1*dif);B=c[2]*tn[2]*sh*(a2*ao+u2*dif);
    if(kind===1){R=Math.min(R,225);G=Math.min(G,225);B=Math.min(B,225)}
    if(snowT>0&&(v<3||v===6)&&fol&&ao>.72){const q=snowT*.55;R+=(235-R)*q;G+=(238-G)*q;B+=(245-B)*q}
    vv=Math.max(R,G,B)/255*1.25*(1-f*.8);R+=(f0-R)*f;G+=(f1-G)*f;B+=(f2-B)*f;
    code[cell]=CC[fol?G_LEAF:G_WOOD][clamp(vv*15+(nz-.5)*2,0,15)|0];cr[cell]=R;cg[cell]=G;cb[cell]=B}}

// ═══ ουρανός: σύννεφα, αστέρια πάνω στην ουράνια σφαίρα, ήλιος ═══
function sky(yaw,E,t){
  const cl=mix(E.top,[255,255,255],.35+.65*E.day),warm=E.warm*.55;
  for(let c=0;c<COLS;c++){const dxp=(c+.5)*CW-W/2,lat=dxp/F,sh=dxp*TANR;
    for(let r=0;r<ROWS;r++){const vert=(Hz+sh-(r+.5)*CH)/F;if(vert<-.05)break;const i=r*COLS+c;if(zb[i]<1e8)continue;const q=vert+.22;
      const n=.48*vnoise(lat/q*1.05+yaw*3+t*.018,1.1/q+t*.009,1<<20)
        +.34*vnoise(lat/q*2.35+7+yaw*3,2.6/q+t*.014,1<<20)
        +.18*vnoise(lat/q*4.8-13+yaw*2,5.1/q,1<<20);
      // Απαλές ηλιακές λωρίδες μέσα στην ατμόσφαιρα, όχι έντονες ακτίνες τύπου προβολέα.
      const beamAxis=(E.S[0]*FZ-E.S[2]*FX)/Math.max(.08,E.S[0]*FX+E.S[2]*FZ),
        beam=Math.exp(-Math.pow((lat-beamAxis*.16)/(.12+vert*.22),2))*.045*E.sunI*clamp(vert*2,0,1);
      if(n>.585&&vert>-.02){const d=clamp((n-.585)/.25,0,1),k=(.42+.58*d)*(.55+.45*E.day);
        code[i]=CC[G_CLOUD][clamp(d*10+2,0,15)|0];cr[i]=(cl[0]+(255-cl[0])*warm)*k;cg[i]=(cl[1]+(150-cl[1])*warm)*k;cb[i]=(cl[2]+(110-cl[2])*warm)*k}
      else if(beam>.004){cr[i]=cl[0]*beam;cg[i]=cl[1]*beam;cb[i]=cl[2]*beam}}}
}
function birds(t){
  // Μακρινά πουλιά σε μικρά, ασύγχρονα σμήνη. Η κίνηση είναι ήπια και διακριτική.
  if(SP.snow>.96)return;
  for(let flock=0;flock<3;flock++){
    const count=3+(flock%2),base=((t*(2.2+flock*.55)+flock*W*.39)%(W+90))-45,
      y=Hz*(.42+flock*.16)+Math.sin(t*.42+flock*2.1)*7;
    for(let b=0;b<count;b++){
      const x=base+b*9+Math.sin(t*.7+b+flock)*2.5,yy=y+Math.sin(t*1.15+b*1.7+flock)*3.2,
        col=Math.floor(x/CW),row=Math.floor(yy/CH);
      if(col<1||col>=COLS-1||row<1||row>=ROWS)continue;
      const i=row*COLS+col;if(zb[i]<1e8)continue;
      code[i]=b%2?118:94;cr[i]=34;cg[i]=43;cb[i]=48;
      if(col+1<COLS&&zb[i+1]>=1e8){code[i+1]=b%2?118:94;cr[i+1]=34;cg[i+1]=43;cb[i+1]=48}
    }
  }
}
function stars(yaw,E,t){   // κάθε αστέρι έχει σταθερή θέση στον ουρανό: κινείται στην οθόνη όταν στρίβουμε και γυρίζει αργά με τη νύχτα
  if(E.night<.2)return;const fx=FX,fz=FZ,rot=t*.006;
  for(let s=0;s<NSTAR;s++){const az=STAR_AZ[s]+rot,ce=Math.cos(STAR_EL[s]),y=Math.sin(STAR_EL[s]),dx=ce*Math.sin(az),dz=ce*Math.cos(az),zc=dx*fx+dz*fz;
    if(zc<.08)continue;const sx=F*(dx*RX+dz*RZ)/zc,col=Math.floor((W/2+sx)/CW),row=Math.floor((Hz+sx*TANR-F*y/zc)/CH);
    if(col<0||col>=COLS||row<0||row>=ROWS)continue;const i=row*COLS+col;if(zb[i]<1e8||code[i])continue;
    const b=STAR_B[s],v=(110+140*b)*(.65+.35*Math.sin(t*3+s))*E.night;code[i]=b>.9?42:46;cr[i]=cg[i]=v;cb[i]=v+10}}
function sun(E){
  const zc=E.S[0]*FX+E.S[2]*FZ;if(zc<.05||E.sy<-.08)return;
  const px=W/2+F*(E.S[0]*FZ-E.S[2]*FX)/zc,py=Hz+(px-W/2)*TANR-F*E.S[1]/zc,R=16,G=70,c0=Math.floor(px/CW),r0=Math.floor(py/CH),rc=Math.ceil(G/CW),rr=Math.ceil(G/CH);
  for(let r=r0-rr;r<=r0+rr;r++)for(let c=c0-rc;c<=c0+rc;c++){if(r<0||r>=ROWS||c<0||c>=COLS)continue;const i=r*COLS+c;if(zb[i]<1e8)continue;
    const d=Math.hypot((c+.5)*CW-px,(r+.5)*CH-py);
    if(d<R){code[i]=d<R*.6?64:79;cr[i]=255;cg[i]=E.sunC[1]*255;cb[i]=E.sunC[2]*255}
    else if(d<G&&!code[i]){const g=Math.pow(1-(d-R)/(G-R),2)*(.4+.6*E.sunI);code[i]=g>.35?58:46;cr[i]=E.sunC[0]*255*g;cg[i]=E.sunC[1]*255*g;cb[i]=E.sunC[2]*255*g}}}

// ═══ ένα καρέ: σταθερή πτήση κατά μήκος του ποταμού, σε μέσο ύψος ═══
function frame(t){
  const E=env(t),cz=flightZ,cx=mer(cz),yaw=Math.atan2(mer(cz+15)-cx,15)*.9,cy=hAt(cx,cz)+CRUISE;
  const rate=(yaw-prevYaw)/Math.max(DT,1e-3);prevYaw=yaw;rollS+=(clamp(-rate*3.5,-.12,.12)-rollS)*(1-Math.exp(-DT*3));TANR=Math.tan(rollS);   // κλίση στις στροφές
  FX=Math.sin(yaw);FZ=Math.cos(yaw);RX=FZ;RZ=-FX;Hz=H*.4;
  for(let i=0;i<256;i++){const tt=Math.pow(i/255,1.5);for(let q=0;q<3;q++)SKYT[i*3+q]=E.top[q]+(E.hor[q]-E.top[q])*tt}
  code.fill(0);zb.fill(1e9);
  shadowStep(E);terrain(cx,cz,cy,E,t);trees(cx,cz,cy,E,t);sky(yaw,E,t);birds(t);stars(yaw,E,t);sun(E);
  return E}

// ═══ οθόνη ═══
function pack(){
  for(let r=0,i=0,o=0;r<ROWS;r++){const py=(r+.5)*CH;
    for(let c=0;c<COLS;c++,i++,o+=4){A[o]=cr[i];A[o+1]=cg[i];A[o+2]=cb[i];A[o+3]=code[i]||32;
      if(zb[i]<1e8){B[o]=cr[i]*.55;B[o+1]=cg[i]*.55;B[o+2]=cb[i]*.55}
      else{const ix=(clamp((py-((c+.5)*CW-W/2)*TANR)/Hz,0,1)*255|0)*3;B[o]=SKYT[ix];B[o+1]=SKYT[ix+1];B[o+2]=SKYT[ix+2]}B[o+3]=255}}
  gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,tA);gl.texSubImage2D(gl.TEXTURE_2D,0,0,0,COLS,ROWS,gl.RGBA,gl.UNSIGNED_BYTE,A);
  gl.activeTexture(gl.TEXTURE1);gl.bindTexture(gl.TEXTURE_2D,tB);gl.texSubImage2D(gl.TEXTURE_2D,0,0,0,COLS,ROWS,gl.RGBA,gl.UNSIGNED_BYTE,B);
  gl.drawArrays(gl.TRIANGLES,0,3)}
function hudDraw(E,t){
  const dpr=window.devicePixelRatio||1,w=innerWidth,h=innerHeight;hx.setTransform(dpr,0,0,dpr,0,0);hx.clearRect(0,0,w,h);hx.font="13px "+MONO;hx.textBaseline="top";hx.textAlign="left";
  const hh=Math.floor(E.hour),mm=Math.floor((E.hour-hh)*60),s=((ctl.ss%4)+4)%4,L=[[SIGNATURE,"rgb(190,184,210)"],
    ["time "+String(hh).padStart(2,"0")+":"+String(mm).padStart(2,"0")+"   "+SEASN[Math.round(s)%4],"rgb(190,198,215)"],
    ["speed "+Math.round(SPEED*3.6)+" m/s   trees "+visTrees,"rgb(190,198,215)"]];
  hx.shadowColor="rgba(0,0,0,.7)";hx.shadowBlur=4;L.forEach(([s,c],i)=>{hx.fillStyle=c;hx.fillText(s,16,h-22*L.length-14+22*i)});
  hx.textAlign="right";hx.fillStyle="rgb(255,196,90)";hx.fillText(paused?"paused":"t "+t.toFixed(1)+"s",w-16,14);
  hx.fillStyle="rgba(220,226,240,.6)";hx.fillText("Space pause · T ώρα · E εποχή · S screenshot",w-16,h-26)}

addEventListener("resize",layout);layout();
let t=0,paused=false,last=performance.now(),acc=0,ema=20,n=0;
function loop(now){
  requestAnimationFrame(loop);acc+=now-last;last=now;if(acc<1000/FPS-3)return;
  const dt=Math.min(acc,100)/1000;acc=0;DT=dt;
  if(!paused){t+=dt;flightZ+=dt*SPEED}
  const t0=performance.now();updateState(t,dt);const E=frame(t);pack();hudDraw(E,t);ema=ema*.9+(performance.now()-t0)*.1;
  if(!FIXED&&++n%45===0){   // αυτόματη προσαρμογή: ευκρίνεια όσο αντέχει το μηχάνημα
    if(ema>30&&CWC<10){CWC=Math.min(10,CWC*1.15);layout();ema=20}
    else if(ema<13&&CWC>2.01){CWC=Math.max(2,CWC/1.1);layout();ema=20}}
}
addEventListener("keydown",e=>{
  if(e.code==="Space"){paused=!paused;e.preventDefault()}
  else if(e.key==="r"||e.key==="R"){t=0;flightZ=0}
  else if(e.key==="t"||e.key==="T")t+=DAY/8;
  else if(e.key==="e"||e.key==="E")ctl.ssT=Math.round(ctl.ssT)+1;
  else if(e.key==="s"||e.key==="S")glc.toBlob(b=>{const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="ascii_valley.png";a.click()})});
requestAnimationFrame(loop);
</script></body></html>
